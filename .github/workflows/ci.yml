name: CI

# Only changes that can break the image. Everything else is checked by
# openpreflight itself (below).
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - go.mod
      - go.sum
      - 'internal/web/package*.json'
      - '.github/workflows/**'
  pull_request:
    paths:
      - Dockerfile
      - go.mod
      - go.sum
      - 'internal/web/package*.json'
      - '.github/workflows/**'

permissions:
  contents: read

# `go vet` and `go test` are not here: openpreflight checks this repository
# itself, at ci.openpreflight.xyz, via the committed `.ci.yml`. Running them
# twice made the Check Run on a commit ambiguous about which system had
# actually gated it. The image build stays because openpreflight reports
# checks and does not publish artifacts.
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build .
