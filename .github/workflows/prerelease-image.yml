name: Prerelease image

# Manual pin for a test tag. Does not run on v* (that is release.yml) and
# never writes :latest.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image and git tag (must already exist)
        required: true
        default: "2.0.2-ui"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/openpreflight/openpreflight

jobs:
  image:
    name: Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
