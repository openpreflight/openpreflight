# Standalone: this file needs no checkout. Download it, set CI_SECRET_KEY, and
# start.
#
#   curl -O https://raw.githubusercontent.com/openpreflight/openpreflight/main/compose.prod.yaml
#   export CI_SECRET_KEY="$(openssl rand -base64 48)"
#   docker compose -f compose.prod.yaml up -d
#
# compose.yaml in the repository builds from source instead, and is what
# contributors use.
services:
  openpreflight:
    # Pin a release with OPENPREFLIGHT_VERSION=1.0.0 rather than editing this
    # file. Published tags are the full version, major.minor, and latest.
    image: ghcr.io/openpreflight/openpreflight:${OPENPREFLIGHT_VERSION:-latest}
    environment:
      # Required. Generate with: openssl rand -base64 48
      # Rotation: set CI_SECRET_KEY to the new key and CI_SECRET_KEY_OLD to the
      # previous one, start once, then unset CI_SECRET_KEY_OLD.
      CI_SECRET_KEY: ${CI_SECRET_KEY:?set CI_SECRET_KEY}
      CI_SECRET_KEY_OLD: ${CI_SECRET_KEY_OLD:-}
      # Optional. Seeds the public base URL on first boot only; the setup
      # wizard asks for it otherwise.
      CI_PUBLIC_BASE_URL: ${CI_PUBLIC_BASE_URL:-}
      # Optional: seeds the admin on first boot so the API can be driven without
      # opening the browser wizard.
      CI_BOOTSTRAP_ADMIN_PASSWORD: ${CI_BOOTSTRAP_ADMIN_PASSWORD:-}
      CI_DOCKER_HOST: ${CI_DOCKER_HOST:-unix:///var/run/docker.sock}
      LISTEN_ADDR: ":8080"
      DATA_DIR: /data
      WORKSPACE_DIR: /workspace
    ports:
      - "8080:8080"
    volumes:
      # Config, job history and logs. This must survive a redeploy.
      - ci-data:/data
      # Per-job checkouts. Disposable, but a volume keeps builds off the
      # container's writable layer.
      - ci-workspace:/workspace
      # Sibling job containers. Required for `runtime:` and fork PRs.
      - /var/run/docker.sock:/var/run/docker.sock
    # The socket's group as the container sees it, which is not always what the
    # host reports. Read it from inside:
    #   docker compose -f compose.prod.yaml exec openpreflight stat -c %g /var/run/docker.sock
    # 998 suits a typical Linux docker group; Docker Desktop needs 0.
    group_add:
      - ${DOCKER_GID:-998}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  ci-data:
  ci-workspace:
