runtime: node:22
install: v=$(awk '/^go /{print $2}' go.mod) && mkdir -p /work/.ci-go && curl -fsSL "https://go.dev/dl/go${v}.linux-amd64.tar.gz" | tar -C /work/.ci-go -xz && /work/.ci-go/go/bin/go mod download
test: export PATH="/work/.ci-go/go/bin:$PATH" && go vet ./... && go test ./... && go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
timeout: 15m
