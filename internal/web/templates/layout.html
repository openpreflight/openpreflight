{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · Coolify CI</title>
{{if gt .RefreshSeconds 0}}<meta http-equiv="refresh" content="{{.RefreshSeconds}}">{{end}}
<style>{{.CSS}}</style>
</head>
<body>
<header class="border-b border-line bg-panel">
  <div class="mx-auto flex max-w-[1080px] flex-wrap items-center gap-5 px-5">
    <a class="brand" href="/">Coolify CI</a>
    {{if .User}}
    <nav class="flex flex-wrap gap-5">
      <a href="/" class="nav-link {{if eq .Nav "home"}}on{{end}}">Overview</a>
      <a href="/coolify" class="nav-link {{if eq .Nav "coolify"}}on{{end}}">Coolify</a>
      <a href="/github-apps" class="nav-link {{if eq .Nav "apps"}}on{{end}}">GitHub Apps</a>
      <a href="/repos" class="nav-link {{if eq .Nav "repos"}}on{{end}}">Repos</a>
      <a href="/jobs" class="nav-link {{if eq .Nav "jobs"}}on{{end}}">Jobs</a>
      <a href="/settings" class="nav-link {{if eq .Nav "settings"}}on{{end}}">Settings</a>
    </nav>
    <form method="post" action="/api/v1/logout" class="m-0">
      {{.CSRFField}}<button class="link" type="submit">Sign out</button>
    </form>
    {{end}}
  </div>
</header>
<main class="mx-auto px-5 pb-16 pt-6 {{if .Narrow}}max-w-[420px]{{else}}max-w-[1080px]{{end}}">
{{if .Flash}}<div class="flash {{.FlashKind}}">{{.Flash}}</div>{{end}}
{{template "content" .}}
</main>
</body>
</html>{{end}}
