{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · Coolify CI</title>
<style>
:root {
  --bg: #fbfbfa; --panel: #fff; --ink: #1d1d1b; --muted: #6b6b66;
  --line: #e4e4e0; --accent: #2f6f4f; --danger: #a63d33; --warn: #8a6d20;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --bg:#16171a; --panel:#1e2024; --ink:#e8e8e4; --muted:#9a9a94;
          --line:#2e3136; --accent:#7cc79c; --danger:#e0857b; --warn:#d7b45c; }
}
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink);
  font:15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
a { color:var(--accent); }
header.top { border-bottom:1px solid var(--line); background:var(--panel); }
header.top .inner { max-width:1080px; margin:0 auto; padding:0 20px; display:flex;
  align-items:center; gap:20px; flex-wrap:wrap; }
header.top .brand { font-weight:600; padding:14px 0; margin-right:auto; }
nav a { display:inline-block; padding:14px 2px; text-decoration:none; color:var(--muted);
  border-bottom:2px solid transparent; }
nav a:hover { color:var(--ink); }
nav a.on { color:var(--ink); border-bottom-color:var(--accent); }
main { max-width:1080px; margin:0 auto; padding:24px 20px 64px; }
h1 { font-size:22px; margin:0 0 4px; }
h2 { font-size:16px; margin:28px 0 10px; }
p.lede { color:var(--muted); margin:0 0 24px; }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:8px;
  padding:18px; margin-bottom:20px; }
.panel > h2:first-child { margin-top:0; }
table { width:100%; border-collapse:collapse; font-size:14px; }
th, td { text-align:left; padding:9px 10px; border-bottom:1px solid var(--line);
  vertical-align:top; }
th { color:var(--muted); font-weight:500; font-size:12px; text-transform:uppercase;
  letter-spacing:.04em; }
tr:last-child td { border-bottom:none; }
label { display:block; margin:12px 0 4px; font-size:13px; color:var(--muted); }
input[type=text], input[type=password], input[type=number], input[type=url], textarea, select {
  width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:6px;
  background:var(--bg); color:var(--ink); font:inherit; }
textarea { font-family:var(--mono); font-size:13px; min-height:120px; }
.row { display:flex; gap:16px; flex-wrap:wrap; }
.row > * { flex:1 1 220px; }
button, .btn { font:inherit; padding:8px 14px; border-radius:6px; border:1px solid var(--line);
  background:var(--panel); color:var(--ink); cursor:pointer; text-decoration:none;
  display:inline-block; }
button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
button.link { border:none; background:none; color:var(--accent); padding:4px 0; }
button.danger { border:none; background:none; color:var(--danger); padding:4px 0; }
.actions { margin-top:16px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.flash { padding:11px 14px; border-radius:6px; margin-bottom:18px; border:1px solid var(--line);
  background:var(--panel); }
.flash.err { border-color:var(--danger); color:var(--danger); }
.flash.ok { border-color:var(--accent); }
code, .mono { font-family:var(--mono); font-size:13px; }
.muted { color:var(--muted); }
.small { font-size:12px; }
.pill { display:inline-block; padding:1px 8px; border-radius:999px; font-size:12px;
  border:1px solid var(--line); }
.pill.ok { color:var(--accent); border-color:var(--accent); }
.pill.bad { color:var(--danger); border-color:var(--danger); }
.pill.warn { color:var(--warn); border-color:var(--warn); }
.pill.off { color:var(--muted); }
pre.log { background:#101114; color:#e6e6e2; padding:16px; border-radius:8px;
  overflow-x:auto; font-family:var(--mono); font-size:12.5px; line-height:1.5;
  max-height:70vh; overflow-y:auto; }
.hint { font-size:12px; color:var(--muted); margin-top:4px; }
.grid2 { display:grid; grid-template-columns:repeat(auto-fit, minmax(240px,1fr)); gap:16px; }
.checkrow { display:flex; align-items:center; gap:8px; padding:4px 0; }
.checkrow input { width:auto; }
.overflow { overflow-x:auto; }
</style>
</head>
<body>
{{if .User}}
<header class="top"><div class="inner">
  <span class="brand">Coolify CI</span>
  <nav>
    <a href="/" class="{{if eq .Nav "home"}}on{{end}}">Overview</a>
    <a href="/coolify" class="{{if eq .Nav "coolify"}}on{{end}}">Coolify</a>
    <a href="/github-apps" class="{{if eq .Nav "apps"}}on{{end}}">GitHub Apps</a>
    <a href="/repos" class="{{if eq .Nav "repos"}}on{{end}}">Repos</a>
    <a href="/jobs" class="{{if eq .Nav "jobs"}}on{{end}}">Jobs</a>
    <a href="/settings" class="{{if eq .Nav "settings"}}on{{end}}">Settings</a>
  </nav>
  <form method="post" action="/api/v1/logout" style="margin:0">
    {{.CSRFField}}<button class="link" type="submit">Sign out</button>
  </form>
</div></header>
{{end}}
<main>
{{if .Flash}}<div class="flash {{.FlashKind}}">{{.Flash}}</div>{{end}}
{{template "content" .}}
</main>
</body>
</html>{{end}}
